# Hybrid AI Coordinator Specification
# Phase 3-C: ML + LLM Integration
# Version: 1.0.0
# Date: 2025-11-25

project: hybrid-ai-coordinator
version: 1.0.0
status: implemented  # spec-first but implementation already done

# ============================================================
# 1. ARCHITECTURE OVERVIEW
# ============================================================
architecture:
  name: "HybridAICoordinator"
  description: |
    화물차 DTG 시스템을 위한 하이브리드 AI 코디네이터.
    EdgeAIInferenceService(ML)와 SmartOrchestrator(LLM)를 통합하여
    실시간 차량 분석과 자연어 대화를 제공합니다.

  components:
    ml_subsystem:
      name: "EdgeAIInferenceService"
      models:
        - name: "LightGBM"
          task: "Driving behavior classification"
          size_mb: 0.012
          latency_target_ms: 0.012
          accuracy_target: ">90%"
          classes: ["NORMAL", "ECO_DRIVING", "AGGRESSIVE"]

        - name: "TCN"
          task: "Fuel efficiency prediction"
          size_mb: 3.0
          latency_target_ms: 25
          output: "L/100km"
          range: [3.0, 20.0]

        - name: "LSTM-AE"
          task: "Anomaly detection"
          size_mb: 2.5
          latency_target_ms: 35
          output: "anomaly_score"
          threshold: 0.5

    llm_subsystem:
      name: "SmartOrchestrator"
      engines:
        - name: "QwenLLMEngine"
          model: "Qwen2.5-0.5B-Instruct"
          quantization: "INT4"
          size_mb: 300
          latency_target_ms: 2000
          language: "Korean"

        - name: "RuleBasedEngine"
          intents: 12
          latency_target_ms: 15
          fallback: true

    coordinator:
      name: "HybridAICoordinator"
      analysis_types:
        - "ML_ONLY"
        - "LLM_ONLY"
        - "COMBINED"

# ============================================================
# 2. DATA REQUIREMENTS
# ============================================================
data:
  input:
    can_bus:
      source: "J1939 CAN Protocol"
      sampling_rate_hz: 1
      window_size_samples: 60
      fields:
        - name: "vehicleSpeed"
          type: "float"
          unit: "km/h"
          range: [0, 255]
        - name: "engineRPM"
          type: "float"
          unit: "rpm"
          range: [0, 8000]
        - name: "throttlePosition"
          type: "float"
          unit: "%"
          range: [0, 100]
        - name: "brakePosition"
          type: "float"
          unit: "%"
          range: [0, 100]
        - name: "accelerationX"
          type: "float"
          unit: "m/s²"
          range: [-15, 15]
        - name: "accelerationY"
          type: "float"
          unit: "m/s²"
          range: [-15, 15]
        - name: "accelerationZ"
          type: "float"
          unit: "m/s²"
          range: [-15, 15]
        - name: "fuelLevel"
          type: "float"
          unit: "%"
          range: [0, 100]
        - name: "coolantTemp"
          type: "float"
          unit: "°C"
          range: [-40, 150]

    vehicle_context:
      source: "VehicleData"
      fields:
        - name: "cargoWeight"
          type: "double"
          unit: "kg"
          range: [0, 10000]
        - name: "tirePressure"
          type: "double"
          unit: "kPa"
          normal_range: [200, 250]
        - name: "engineTemp"
          type: "double"
          unit: "°C"
          normal_range: [80, 95]
        - name: "fuelEfficiency"
          type: "double"
          unit: "km/L"
          good_threshold: 6.5

    user_query:
      language: "Korean"
      max_length_chars: 200
      examples:
        - "차량 상태 확인해줘"
        - "연비가 왜 이렇게 나빠?"
        - "타이어 압력 괜찮아?"

  output:
    ml_result:
      fields:
        - name: "behavior"
          type: "DrivingBehavior"
          values: ["NORMAL", "ECO_DRIVING", "AGGRESSIVE"]
        - name: "confidence"
          type: "float"
          range: [0, 1]
        - name: "fuelEfficiency"
          type: "float"
          unit: "L/100km"
        - name: "anomalyScore"
          type: "float"
          range: [0, 1]
        - name: "isAnomaly"
          type: "boolean"

    llm_result:
      fields:
        - name: "response"
          type: "string"
          language: "Korean"
          max_chars: 200
        - name: "engine"
          type: "string"
          values: ["QwenLLMEngine", "RuleBasedEngine", "Cache"]
        - name: "latencyMs"
          type: "long"
        - name: "fromCache"
          type: "boolean"

    combined_result:
      fields:
        - name: "mlResult"
          type: "InferenceResult"
          nullable: true
        - name: "llmResult"
          type: "InferenceResult"
        - name: "totalLatencyMs"
          type: "long"
        - name: "error"
          type: "string"
          nullable: true

# ============================================================
# 3. PERFORMANCE TARGETS
# ============================================================
performance_targets:
  latency:
    ml_inference:
      target_ms: 50
      p95_ms: 50
      description: "Multi-model parallel inference (LightGBM + TCN + LSTM-AE)"

    llm_inference:
      target_ms: 3000
      p50_ms: 1500
      p95_ms: 3000
      description: "Qwen2.5-0.5B or RuleEngine fallback"

    combined_analysis:
      target_ms: 3500
      p95_ms: 3500
      description: "ML(50ms) + LLM(3000ms) + buffer(450ms)"

    cache_hit:
      target_ms: 10
      description: "Cached response retrieval"

  memory:
    peak_mb: 700
    breakdown:
      ml_models_mb: 6
      llm_model_mb: 300
      runtime_mb: 150
      buffer_mb: 244

    device_constraints:
      min_available_mb: 200
      gc_trigger_mb: 150

  throughput:
    ml_samples_per_second: 20
    llm_queries_per_minute: 30
    auto_analysis_interval_ms: 60000

  reliability:
    error_rate_target: "<5%"
    timeout_handling: "fallback to RuleEngine"
    oom_handling: "GC + fallback"
    thermal_throttle_celsius: 80

# ============================================================
# 4. QUALITY GATES
# ============================================================
quality_gates:
  build:
    - name: "Compilation success"
      check: "gradlew compileDebugKotlin"
      required: true

    - name: "Unit tests pass"
      check: "gradlew testDebugUnitTest"
      required: true
      min_pass_rate: "95%"

    - name: "No critical warnings"
      check: "KAPT without errors"
      required: true

  runtime:
    - name: "LLM initialization"
      target: "<60s"
      required: true

    - name: "Peak RAM usage"
      target: "<700MB"
      required: true

    - name: "P95 combined latency"
      target: "<3500ms"
      required: true

    - name: "Battery drain"
      target: "<5%/hour"
      recommended: true

  functional:
    - name: "Korean response quality"
      check: "Polite form (해요체/합쇼체)"
      required: true

    - name: "Domain accuracy"
      target: ">85%"
      domain: "truck/vehicle"

    - name: "Error rate"
      target: "<5%"
      required: true

