<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, height=480, initial-scale=1.0, user-scalable=no">
    <title>GLEC DTG CES Demo</title>

    <style>
        /* CES Demo Design System */
        :root {
            --primary: #00E5FF;
            --success: #4CAF50;
            --warning: #FFD700;
            --danger: #FF5252;
            --dark: #0A0E27;
            --surface: #1A1F3A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
            width: 1280px;
            height: 480px;
        }

        .container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 640px 640px;
            grid-template-rows: 100%;
            background: linear-gradient(135deg, var(--dark), var(--surface));
        }

        /* Left Panel: 3D Viewer */
        .viewer-panel {
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px solid rgba(0, 229, 255, 0.3);
        }

        #truck-canvas {
            width: 100%;
            height: 100%;
        }

        .viewer-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--primary);
        }

        .viewer-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .viewer-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Right Panel: Dashboard */
        .dashboard-panel {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Header */
        .dashboard-header {
            text-align: center;
            padding: 10px;
            background: rgba(0, 229, 255, 0.1);
            border-radius: 10px;
            border: 1px solid var(--primary);
        }

        .dashboard-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .stat-unit {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-left: 5px;
        }

        /* Safety Score */
        .safety-card {
            grid-column: span 2;
            background: rgba(76, 175, 80, 0.1);
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--success);
            text-align: center;
        }

        .safety-score {
            font-size: 48px;
            font-weight: bold;
            color: var(--success);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 12px;
        }

        .status-item {
            flex: 1;
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            text-align: center;
        }

        .status-green { color: var(--success); }
        .status-yellow { color: var(--warning); }
        .status-red { color: var(--danger); }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulsing {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left: 3D Truck Viewer -->
        <div class="viewer-panel">
            <canvas id="truck-canvas"></canvas>
            <div class="viewer-overlay">
                <div class="viewer-title">🚛 3D Truck Viewer</div>
                <div class="viewer-subtitle" id="viewer-status">로딩 중...</div>
            </div>
        </div>

        <!-- Right: Dashboard -->
        <div class="dashboard-panel">
            <!-- Header -->
            <div class="dashboard-header">
                <div class="dashboard-title">GLEC DTG AI CES Demo</div>
            </div>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <!-- Vehicle Speed -->
                <div class="stat-card">
                    <div class="stat-label">차량 속도</div>
                    <div>
                        <span class="stat-value" id="speed">0</span>
                        <span class="stat-unit">km/h</span>
                    </div>
                </div>

                <!-- Engine RPM -->
                <div class="stat-card">
                    <div class="stat-label">엔진 RPM</div>
                    <div>
                        <span class="stat-value" id="rpm">0</span>
                        <span class="stat-unit">rpm</span>
                    </div>
                </div>

                <!-- Fuel Level -->
                <div class="stat-card">
                    <div class="stat-label">연료 잔량</div>
                    <div>
                        <span class="stat-value" id="fuel">85</span>
                        <span class="stat-unit">%</span>
                    </div>
                </div>

                <!-- Acceleration -->
                <div class="stat-card">
                    <div class="stat-label">가속도</div>
                    <div>
                        <span class="stat-value" id="accel">0.0</span>
                        <span class="stat-unit">m/s²</span>
                    </div>
                </div>

                <!-- Safety Score -->
                <div class="safety-card">
                    <div class="stat-label">안전 점수</div>
                    <div class="safety-score" id="safety">100</div>
                </div>
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-item">
                    <div id="status-can" class="status-green">CAN: 연결됨</div>
                </div>
                <div class="status-item">
                    <div id="status-ai" class="status-green">AI: 정상</div>
                </div>
                <div class="status-item">
                    <div id="status-demo" class="status-green">DEMO: 실행중</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="file:///android_asset/three.min.js"></script>

    <script>
        // ===== 3D Truck Viewer =====
        let scene, camera, renderer, truck;
        let currentColor = 0x00FF00; // Green (normal)

        function init3DViewer() {
            const canvas = document.getElementById('truck-canvas');
            const container = canvas.parentElement;

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0A0E27);

            // Camera
            camera = new THREE.PerspectiveCamera(
                50,
                640 / 480,
                0.1,
                1000
            );
            camera.position.set(5, 3, 5);
            camera.lookAt(0, 1, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(640, 480);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Create simple truck (box model for demo)
            const geometry = new THREE.BoxGeometry(3, 1.5, 1.2);
            const material = new THREE.MeshPhongMaterial({
                color: currentColor,
                shininess: 100,
                specular: 0x444444
            });
            truck = new THREE.Mesh(geometry, material);
            truck.position.y = 1;
            scene.add(truck);

            // Add wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });

            const wheelPositions = [
                [-1, 0.3, -0.7], // Front left
                [-1, 0.3, 0.7],  // Front right
                [1, 0.3, -0.7],  // Rear left
                [1, 0.3, 0.7]    // Rear right
            ];

            wheelPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(pos[0], pos[1], pos[2]);
                scene.add(wheel);
            });

            // Animation loop
            animate();

            document.getElementById('viewer-status').textContent = '3D 뷰어 준비 완료';

            // Notify Android
            if (window.Android) {
                window.Android.log('3D Viewer initialized');
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate truck slowly
            truck.rotation.y += 0.005;

            renderer.render(scene, camera);
        }

        // ===== Data Update Functions =====

        /**
         * Update vehicle data from Android
         * Called by DemoPlaybackEngine
         */
        window.updateVehicleData = function(data) {
            // Update dashboard values
            if (data.vehicleSpeed !== undefined) {
                document.getElementById('speed').textContent = Math.round(data.vehicleSpeed);
            }

            if (data.engineRPM !== undefined) {
                document.getElementById('rpm').textContent = data.engineRPM;
            }

            if (data.fuelLevel !== undefined) {
                document.getElementById('fuel').textContent = Math.round(data.fuelLevel);
            }

            if (data.accelerationX !== undefined) {
                document.getElementById('accel').textContent = data.accelerationX.toFixed(1);
            }

            if (data.safetyScore !== undefined) {
                const safetyEl = document.getElementById('safety');
                safetyEl.textContent = data.safetyScore;

                // Color based on score
                if (data.safetyScore >= 90) {
                    safetyEl.style.color = '#4CAF50'; // Green
                } else if (data.safetyScore >= 70) {
                    safetyEl.style.color = '#FFD700'; // Yellow
                } else {
                    safetyEl.style.color = '#FF5252'; // Red
                }
            }

            // Update truck color
            if (data.vehicleColor !== undefined) {
                const color = new THREE.Color(data.vehicleColor);
                truck.material.color = color;
            }
        };

        /**
         * Animate 3D viewer
         * Called by DemoPlaybackEngine for special effects
         */
        window.animate3DViewer = function(config) {
            if (config.highlightPart) {
                // Flash effect for highlighted part
                const originalColor = truck.material.color.clone();
                const highlightColor = new THREE.Color(config.color || '#FFD700');

                truck.material.color = highlightColor;

                setTimeout(() => {
                    truck.material.color = originalColor;
                }, 500);
            }

            if (config.cameraAngle === 'rotate360') {
                // 360-degree camera rotation
                let angle = 0;
                const duration = (config.duration || 10) * 1000;
                const startTime = Date.now();

                const rotate = () => {
                    const elapsed = Date.now() - startTime;
                    if (elapsed < duration) {
                        angle = (elapsed / duration) * Math.PI * 2;
                        camera.position.x = 5 * Math.cos(angle);
                        camera.position.z = 5 * Math.sin(angle);
                        camera.lookAt(0, 1, 0);
                        requestAnimationFrame(rotate);
                    }
                };

                rotate();
            }
        };

        /**
         * Speak text via TTS (placeholder)
         * Will be connected to Kokoro TTS
         */
        window.speakText = function(text) {
            console.log('🔊 TTS:', text);

            // Flash status indicator
            const statusDemo = document.getElementById('status-demo');
            statusDemo.classList.add('pulsing');
            statusDemo.textContent = 'DEMO: 음성 출력 중';

            setTimeout(() => {
                statusDemo.classList.remove('pulsing');
                statusDemo.textContent = 'DEMO: 실행중';
            }, 3000);

            // TODO: Integrate with Kokoro TTS
            // Android.speakWithKokoro(text);
        };

        /**
         * Get current demo progress (0-100)
         */
        window.getDemoProgress = function() {
            if (window.Android && window.Android.getDemoProgress) {
                return window.Android.getDemoProgress();
            }
            return 0;
        };

        /**
         * Dashboard click handler
         */
        window.onDashboardClick = function(action) {
            if (window.Android && window.Android.onDashboardClick) {
                window.Android.onDashboardClick(action);
            }
        };

        // ===== Initialize on Load =====
        window.addEventListener('load', () => {
            init3DViewer();

            // Test data update (will be replaced by real demo data)
            setTimeout(() => {
                window.updateVehicleData({
                    vehicleSpeed: 60,
                    engineRPM: 1800,
                    fuelLevel: 85,
                    accelerationX: 0.0,
                    safetyScore: 100,
                    vehicleColor: '#00FF00'
                });
            }, 1000);
        });

        // ===== Error Handling =====
        window.addEventListener('error', (event) => {
            console.error('Dashboard error:', event.error);
            if (window.Android) {
                window.Android.log('Dashboard error: ' + event.error.message);
            }
        });
    </script>
</body>
</html>
